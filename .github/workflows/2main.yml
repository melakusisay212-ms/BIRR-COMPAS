name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run typecheck
        continue-on-error: true

  android-apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm install
      - run: npx expo install --fix
      - run: npx expo prebuild --platform android --no-install

      - name: Find the broken module
        run: |
          npx expo-modules-autolinking resolve --platform android --json > /tmp/al.json || true
          node -e "const j=require('/tmp/al.json');(j.modules||[]).forEach((m,i)=>(m.projects||[]).forEach(p=>{if(!p.publication||!p.publication.version)console.log('MISSING VERSION:',i,m.packageName,m.packageVersion)}))" || true
          npm ls expo expo-modules-core expo-modules-autolinking --all | head -40 || true
          npx expo-doctor || true

      - run: ./gradlew assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" -PreactNativeArchitectures=arm64-v8a
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: birr-compass-apk
          path: android/app/build/outputs/apk/release/*.apk
